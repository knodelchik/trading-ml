[project]
name = "trading-ml"
version = "0.1.0"
description = "Rigorous ML crypto trading research pipeline: purged walk-forward CV, leakage tests, nautilus_trader backtests"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ccxt>=4.5,<5",
    "polars>=1.42,<2",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.6,<5",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "nautilus_trader==1.230.0",
    "pydantic>=2.7",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# M2 only — not installed in Milestone 1
ensemble = ["catboost>=1.2.10", "tabpfn>=8", "torch>=2.13", "optuna>=4.9"]
live = [
    "pybit>=5",
]

[project.scripts]
tml = "tml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
