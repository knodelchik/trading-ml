# Single source of truth for the research pipeline.
# Cross-field invariants (e.g. cv.purge_bars >= labels.horizon_bars) are
# validated in src/tml/config.py — edit with that in mind.

[data]
exchange = "binance"          # fallback if geo-blocked: "bybit"
timeframe = "1h"
since = "2020-01-01T00:00:00Z"
funding = true                # USDT-perp funding rates as features
# 22-pair universe (M4): original 10 + 12 verified additions. Criteria:
# Binance spot history <= 2021-06, funding history exists, Bybit linear
# Trading, liquidity >= half of weakest incumbent. SHIB excluded: 1000x
# contract multiplier mismatch across venues. INJ funding starts 2022-08 —
# handled by the fund_known feature flag.
pairs = [
    "BTC/USDT", "ETH/USDT", "BNB/USDT", "XRP/USDT", "ADA/USDT",
    "SOL/USDT", "DOGE/USDT", "LTC/USDT", "LINK/USDT", "DOT/USDT",
    "AAVE/USDT", "UNI/USDT", "NEAR/USDT", "HBAR/USDT", "XLM/USDT",
    "INJ/USDT", "AVAX/USDT", "TRX/USDT", "FIL/USDT", "THETA/USDT",
    "ICP/USDT", "CHZ/USDT",
]

[features]
# multi-scale on the 1h series: 168 = 1 week, 336 = 2 weeks of hourly bars
ret_horizons = [1, 3, 6, 12, 24, 72, 168]
mom_horizons = [24, 72, 168]
vol_spans = [24, 72, 168, 336]
rsi_period = 14
atr_period = 14
donchian_window = 168
volume_z_window = 168
cs_rank_cols = ["mom_24", "mom_72", "mom_168", "vol_ewm_24", "fund_rate"]

[labels]
kind = "fixed_horizon_volscaled"   # "triple_barrier" reserved for M2
horizon_bars = 24
vol_span = 72

[cv]
train_min_bars = 17520             # ~2 years of 1h bars
test_span_bars = 2160              # ~90 days
step_bars = 2160
purge_bars = 24                    # must be >= labels.horizon_bars
embargo_bars = 24

[model]
# TabPFN dropped from the traded ensemble: weak on this noise level
# (OOS IC +0.015, NW t -0.29) and diluted the mean; also NON-COMMERCIAL
# license. Kept available as a diagnostic member if ever re-enabled.
members = ["lgbm", "catboost"]

[model.lgbm]
seed = 42
num_leaves = 31
learning_rate = 0.05
n_estimators = 400
min_data_in_leaf = 200
feature_fraction = 0.8
num_threads = 8

[model.catboost]
seed = 42
depth = 6
iterations = 500
learning_rate = 0.05
l2_leaf_reg = 3.0
thread_count = 8

[model.tabpfn]
seed = 42
max_train_rows = 10000        # recency window per fold (in-context learner)
predict_chunk = 2000
device = "auto"               # resolves to MPS on this machine
n_estimators = 4              # 4 = good speed/quality point on M5 (~220s/fold)

[optuna]
n_trials = 40
inner_splits = 3
inner_train_frac = 0.5

[universe]
# point-in-time monthly top-N by trailing liquidity (see tml/universe.py);
# when enabled, cfg.data.pairs is ignored in favor of membership
enabled = true
size = 30
ranking_window_days = 90
min_history_days = 180
max_gap_days = 3

[live]
# Bybit DEMO paper trading (virtual money, real mainnet prices)
# mirrors backtest sizing: initial_cash / n_pairs (100k / 22)
notional_per_pair_usdt = 4500.0
model_max_age_days = 90            # mirrors the walk-forward retrain cadence
min_order_notional_usdt = 25.0
max_total_exposure_usdt = 100000.0

[backtest]
# hysteresis: enter only when predicted vol-scaled 24h return clears half a
# vol unit (expected edge must exceed round-trip cost), exit when it turns
# negative; positions trade only on state transitions, not every bar
enter_threshold = 0.4
exit_threshold = 0.0
allow_short = true               # M4: symmetric hysteresis on linear perps
execution_delay_bars = 0           # set 1 for conservative next-bar-fill run
initial_cash_usdt = 100000.0

[execution]
# "taker" = market orders (M1-M4 baseline); "maker" = post-only limit one
# tick inside the close, market fallback after limit_ttl_bars. Taker rates
# stay deliberately conservative so maker-mode gains come from style alone.
mode = "maker"
maker_fee_bps = 2.0
taker_fee_bps = 10.0
slippage_bps = 3.0                 # taker fills only; passive fills don't slip
limit_ttl_bars = 2
