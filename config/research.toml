# Single source of truth for the research pipeline.
# Cross-field invariants (e.g. cv.purge_bars >= labels.horizon_bars) are
# validated in src/tml/config.py — edit with that in mind.

[data]
exchange = "binance"          # fallback if geo-blocked: "bybit"
timeframe = "1h"
since = "2020-01-01T00:00:00Z"
funding = true                # USDT-perp funding rates as features
pairs = [
    "BTC/USDT", "ETH/USDT", "BNB/USDT", "XRP/USDT", "ADA/USDT",
    "SOL/USDT", "DOGE/USDT", "LTC/USDT", "LINK/USDT", "DOT/USDT",
]

[features]
# multi-scale on the 1h series: 168 = 1 week, 336 = 2 weeks of hourly bars
ret_horizons = [1, 3, 6, 12, 24, 72, 168]
mom_horizons = [24, 72, 168]
vol_spans = [24, 72, 168, 336]
rsi_period = 14
atr_period = 14
donchian_window = 168
volume_z_window = 168
cs_rank_cols = ["mom_24", "mom_72", "mom_168", "vol_ewm_24", "fund_rate"]

[labels]
kind = "fixed_horizon_volscaled"   # "triple_barrier" reserved for M2
horizon_bars = 24
vol_span = 72

[cv]
train_min_bars = 17520             # ~2 years of 1h bars
test_span_bars = 2160              # ~90 days
step_bars = 2160
purge_bars = 24                    # must be >= labels.horizon_bars
embargo_bars = 24

[model]
# NOTE: TabPFN weights are licensed NON-COMMERCIAL — fine for research and
# paper trading; must be dropped (or commercially licensed) before any
# real-money use. LightGBM/CatBoost carry no such restriction.
members = ["lgbm", "catboost", "tabpfn"]

[model.lgbm]
seed = 42
num_leaves = 31
learning_rate = 0.05
n_estimators = 400
min_data_in_leaf = 200
feature_fraction = 0.8
num_threads = 8

[model.catboost]
seed = 42
depth = 6
iterations = 500
learning_rate = 0.05
l2_leaf_reg = 3.0
thread_count = 8

[model.tabpfn]
seed = 42
max_train_rows = 10000        # recency window per fold (in-context learner)
predict_chunk = 2000
device = "auto"               # resolves to MPS on this machine
n_estimators = 4              # 4 = good speed/quality point on M5 (~220s/fold)

[optuna]
n_trials = 40
inner_splits = 3
inner_train_frac = 0.5

[backtest]
# hysteresis: enter only when predicted vol-scaled 24h return clears half a
# vol unit (expected edge must exceed round-trip cost), exit when it turns
# negative; positions trade only on state transitions, not every bar
enter_threshold = 0.5
exit_threshold = 0.0
taker_fee_bps = 10.0               # Binance spot default
slippage_bps = 3.0
execution_delay_bars = 0           # set 1 for conservative next-bar-fill run
initial_cash_usdt = 100000.0
